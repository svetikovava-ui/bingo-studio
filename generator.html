<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bingo Studio</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/generator.css">

</head>


<body>


<!-- ===============================
     HEADER
================================ -->

<header class="header no-print">

    <div class="logo">

        <div class="logo-icon">
            B
        </div>


        <div class="logo-title">
            Bingo <span>Studio</span>
        </div>

    </div>

</header>





<!-- ===============================
     MAIN
================================ -->


<main class="container">



<h1 class="title no-print">

    Генератор Bingo карточек

</h1>



<p class="subtitle no-print">

    Создавайте уникальные карточки для музыкального бинго

</p>





<!-- ===============================
     GENERATOR
================================ -->


<div class="generator-layout">





<!-- ===============================
     SETTINGS PANEL
================================ -->


<section class="panel no-print">


<h2>
⚙ Настройки игры
</h2>




<div class="form-group">


<label for="cardSize">

Размер карточки

</label>



<select id="cardSize">


<option value="3">

3 × 3

</option>


<option value="4">

4 × 4

</option>


<option value="5">

5 × 5

</option>


</select>


</div>






<div class="form-group">


<label for="printFormat">

Формат печати

</label>


<select id="printFormat">


<option value="A5">

A5 — большая карточка

</option>


<option value="A4">

A4 — 2 карточки на лист

</option>


</select>


</div>







<div class="form-group">


<label for="cardCount">

Количество карточек

</label>



<input

id="cardCount"

type="number"

value="10"

min="1"

max="200"

/>



</div>







<div class="form-group">


<label for="songInput">

Список песен

</label>



<textarea

id="songInput"

rows="15"

placeholder="Введите песни по одной на строку"

>

ABBA — Mamma Mia
Руки Вверх — Алёшка
Земляне — Трава у дома
Queen — We Will Rock You
Король и Шут — Лесник
Ленинград — Экспонат
Madonna — Like a Prayer
Roxette — Listen To Your Heart

</textarea>



</div>








<div class="buttons">


<button

class="btn btn-gold"

id="generateBtn"

type="button"

>

✨ Создать карточки

</button>





<button

class="btn btn-dark"

id="printBtn"

type="button"

>

🖨 Печать

</button>






<button

class="btn btn-dark"

id="pdfBtn"

type="button"

>

📄 PDF

</button>



</div>



</section>







<!-- ===============================
     PREVIEW
================================ -->


<section class="preview no-print">


<div class="preview-title">

Предпросмотр

</div>





<div

id="previewCard"

class="preview-card"

>


<div class="bingo-card">





<div class="card-header">


<h1>

BINGO

</h1>


<span>

Music Edition

</span>



</div>







<div

class="bingo-grid grid-3"

id="bingoGrid"

>



<div class="bingo-cell">


Нажмите создать


</div>



</div>





</div>


</div>


</section>





</div>









<!-- ===============================
     GENERATED CARDS
================================ -->


<section

class="cards-container"

id="cardsContainer"

>



</section>





</main>









<!-- ===============================
     JAVASCRIPT
================================ -->


<script src="js/generator.js"></script>



</body>


</html>
