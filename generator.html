<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bingo Studio</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ===============================
         HEADER
    ================================ -->

    <header class="header">

        <div class="logo">

            <div class="logo-icon">
                B
            </div>

            <div class="logo-title">
                Bingo <span>Studio</span>
            </div>

        </div>

    </header>


    <!-- ===============================
         MAIN
    ================================ -->

    <main class="container">

        <h1 class="title">
            Генератор Bingo карточек
        </h1>

        <p class="subtitle">
            Создавайте уникальные карточки для музыкального бинго
        </p>


        <!-- ===============================
             GENERATOR LAYOUT
        ================================ -->

        <div class="generator-layout">


            <!-- ===============================
                 LEFT PANEL
            ================================ -->

            <div class="panel">

                <h2>
                    ⚙ Настройки игры
                </h2>


                <!-- Размер карточки -->

                <div class="form-group">

                    <label for="cardSize">
                        Размер карточки
                    </label>

                    <select id="cardSize">

                        <option value="3">
                            3 × 3
                        </option>

                        <option value="4">
                            4 × 4
                        </option>

                        <option value="5">
                            5 × 5
                        </option>

                    </select>

                </div>


                <!-- Количество карточек -->

                <div class="form-group">

                    <label for="cardCount">
                        Количество карточек
                    </label>

                    <input
                        id="cardCount"
                        type="number"
                        value="10"
                        min="1"
                        max="100"
                    >

                </div>


                <!-- Список песен -->

                <div class="form-group">

                    <label for="songInput">
                        Список песен
                    </label>

                    <textarea
                        id="songInput"
                        rows="12"
                        placeholder="Введите песни по одной на строку"
                    >EMMA M — Чистые глаза
Руки Вверх! — Алёшка
Земляне — Трава у дома
Король и Шут — Лесник
Ленинград — Экспонат</textarea>

                </div>


                <!-- Создать карточки -->

                <button
                    class="btn btn-gold"
                    id="generateBtn"
                    type="button"
                >
                    ✨ Создать карточки
                </button>


                <br><br>


                <!-- Печать -->

                <button
                    class="btn btn-dark"
                    type="button"
                    onclick="window.print()"
                >
                    🖨 Печать карточек
                </button>


                <!-- Список песен -->

<div
    class="song-list"
    id="songList">
</div>

            </div>


            <!-- ===============================
                 RIGHT PREVIEW
            ================================ -->

            <div class="preview">

                <div class="preview-title">
                    Предпросмотр
                </div>


                <div id="previewCard">

                    <div class="bingo-card">

                        <div class="card-header">

                            <h1>
                                BINGO
                            </h1>

                            <span>
                                Music Edition
                            </span>

                        </div>


                        <div
                            class="bingo-grid grid-3"
                            id="bingoGrid"
                        >

                            <div class="bingo-cell">
                                Нажмите создать
                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>


        <!-- ===============================
             GENERATED CARDS
        ================================ -->

        <div
            class="cards-container"
            id="cardsContainer"
        >
        </div>

    </main>


    <!-- ===============================
         JAVASCRIPT
    ================================ -->

    <script src="script.js"></script>

</body>

</html>
