<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bingo Studio</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/generator.css">

</head>


<body>


<!-- HEADER -->

<header class="header">

    <div class="logo">

        <h1>Bingo Studio</h1>

    </div>

</header>



<!-- MAIN -->

<main class="generator-container">


    <!-- ЛЕВАЯ ПАНЕЛЬ НАСТРОЕК -->

    <section class="settings-panel">


        <h2>Настройки игры</h2>


        <label>
            Название игры
        </label>

        <input 
        type="text" 
        id="gameTitle"
        value="Music Edition">



        <label>
            Количество карточек
        </label>

        <input 
        type="number" 
        id="cardCount"
        value="10"
        min="1">



        <label>
            Размер карточки
        </label>

        <select id="gridSize">

            <option value="3">
                3 x 3
            </option>

            <option value="4">
                4 x 4
            </option>

            <option value="5">
                5 x 5
            </option>

        </select>



        <label>
            Список элементов
        </label>

        <textarea 
        id="itemsList"
        placeholder="Введите слова или песни, каждое с новой строки"></textarea>



        <button 
        id="createCards"
        class="create-button">

            Создать карточки

        </button>


    </section>





    <!-- ПРАВАЯ ПАНЕЛЬ ПРЕДПРОСМОТРА -->

    <section class="preview-panel">


        <h2>
            Созданные карточки
        </h2>



        <div 
        id="bingoGrid"
        class="cards-preview">


            <!-- Здесь появятся карточки -->

        </div>


    </section>



</main>




<script src="js/generator.js"></script>


</body>

</html>
